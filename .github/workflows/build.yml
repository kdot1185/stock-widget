name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Smoke tests
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace 2>&1 | tee test.log
      - name: Yahoo probe
        if: always()
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          {
            echo "### yahoo probe (curl)"
            for h in query1 query2; do
              code=$(curl -s -o /tmp/y.json -w "%{http_code}" -A "$UA" "https://$h.finance.yahoo.com/v8/finance/chart/MU?interval=1m&range=1d&includePrePost=true")
              echo "$h no-cookie: $code $(head -c 160 /tmp/y.json)"
            done
            curl -s -c /tmp/jar -b /tmp/jar -A "$UA" -o /dev/null https://fc.yahoo.com/ || true
            crumb=$(curl -s -c /tmp/jar -b /tmp/jar -A "$UA" https://query2.finance.yahoo.com/v1/test/getcrumb)
            echo "crumb: ${crumb:0:40}"
            code=$(curl -s -o /tmp/y.json -w "%{http_code}" -c /tmp/jar -b /tmp/jar -A "$UA" "https://query2.finance.yahoo.com/v8/finance/chart/MU?interval=1m&range=1d&includePrePost=true&crumb=$crumb")
            echo "with cookie+crumb: $code $(head -c 160 /tmp/y.json)"
          } > probe.md 2>&1
          cat probe.md
      - name: Collect test output
        if: always()
        run: |
          {
            echo '```'
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.argv[1]).getroot()
          print(f"SUITE {r.get('name')} tests={r.get('tests')} failures={r.get('failures')} errors={r.get('errors')}")
          for tc in r.iter('testcase'):
              bad = [c for c in tc if c.tag in ('failure', 'error')]
              print(("FAIL " if bad else "ok   ") + tc.get('name'))
              for b in bad:
                  print((b.text or '')[:4000])
          out = r.find('system-out')
          if out is not None and out.text: print(out.text[-12000:])
          err = r.find('system-err')
          if err is not None and err.text: print("STDERR:", err.text[-6000:])
          PY
            done
            echo '```'
            echo '### gradle tail'
            echo '```'
            grep -vE "^\s*at (org\.gradle|java\.base|jdk\.|worker\.org)" test.log 2>/dev/null | tail -150
            echo '```'
            cat probe.md 2>/dev/null
          } > notes.md
          head -c 100000 notes.md > notes_trim.md
      - name: Build
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk stock-widget-${{ github.run_number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: stock-widget-${{ github.run_number }}.apk
          make_latest: true
          body_path: notes_trim.md
